<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkon City | Portal Warga SPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Replikasi Desain Pusat Pelayanan Linkon City (Port 8000) */
        :root {
            --linkon-blue: #4a90e2;
            --linkon-dark-blue: #2c5aa0;
            --linkon-bg: #eef5fc;
            --linkon-card-bg: #ffffff;
        }

        body {
            background-color: var(--linkon-bg);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #3a506b;
        }

        /* Navbar Berwarna Biru Solid Sesuai Contoh Gambar */
        .navbar {
            background-color: #1e70cd !important;
            box-shadow: 0 4px 15px rgba(30, 112, 205, 0.2);
            padding: 15px 0;
        }
        .navbar-brand {
            font-size: 1.4rem;
            letter-spacing: 0.3px;
        }

        /* Card Melayang Sudut Bulat Halus (Sama Seperti Main Card Port 8000) */
        .custom-card {
            border: none;
            border-radius: 24px;
            background: var(--linkon-card-bg);
            box-shadow: 0 10px 35px rgba(74, 144, 226, 0.12);
        }

        /* Form Input dengan Background Biru Sangat Muda Ketika Fokus */
        .form-control {
            border-radius: 14px;
            padding: 14px 18px;
            border: 2px solid #d0e1f9;
            background-color: #f7faff;
            color: #2c5aa0;
            font-weight: 500;
        }
        .form-control:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(74, 144, 226, 0.2);
            border-color: var(--linkon-blue);
        }

        /* Tombol Utama rounded dengan Warna Biru Terang Icon */
        .btn-linkon {
            background-color: #1e70cd;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-linkon:hover {
            background-color: var(--linkon-dark-blue);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 112, 205, 0.3);
        }

        /* Dashed Placeholder Tengah Dashboard */
        .border-dashed {
            border: 3px dashed #b0d4ff !important;
            background: #fbfdff !important;
        }
        
        .badge-blue {
            background-color: #e1effe;
            color: #1e70cd;
        }

        .report-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(74, 144, 226, 0.16);
        }

        .report-title {
            display: block;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
            line-height: 1.35;
            min-height: auto;
        }

        .status-badge {
            white-space: normal;
            text-align: center;
            flex-shrink: 0;
        }

        .report-description {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 4.2em;
        }

        .report-meta {
            font-size: 0.85rem;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="#login">
                <i class="bi bi-buildings-fill me-2"></i>Linkon City
            </a>
            <div id="nav-menus" class="ms-auto"></div>
        </div>
    </nav>

    <main class="container mb-5" id="app-content"></main>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white" style="background-color: #1e70cd !important;">
                    <h5 class="modal-title fw-bold" id="reportModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>Buat Laporan Baru
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-4">
                    <form id="reportForm">
                        <input type="hidden" id="reportId">

                        <div class="mb-3">
                            <label for="reportTitle" class="form-label small fw-bold text-secondary">Judul Laporan</label>
                            <input type="text" id="reportTitle" class="form-control" placeholder="Contoh: Lampu Jalan Padam" required>
                        </div>

                        <div class="mb-3">
                            <label for="reportCategory" class="form-label small fw-bold text-secondary">Kategori</label>
                            <input type="text" id="reportCategory" class="form-control" placeholder="Contoh: Kebersihan, Jalan, Air" required>
                        </div>

                        <div class="mb-3">
                            <label for="reportLocation" class="form-label small fw-bold text-secondary">Lokasi</label>
                            <input type="text" id="reportLocation" class="form-control" placeholder="Contoh: Jalan Merdeka No. 10" required>
                        </div>

                        <div class="mb-4">
                            <label for="reportDescription" class="form-label small fw-bold text-secondary">Deskripsi Detail</label>
                            <textarea id="reportDescription" class="form-control" rows="4" placeholder="Ceritakan kronologi atau detail kendala di lokasi..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-outline-secondary fw-bold px-4" id="btnDraft" style="border-radius: 12px;">
                                <i class="bi bi-bookmark-fill me-1"></i>Simpan Draft
                            </button>
                            <button type="button" class="btn btn-primary fw-bold px-4" id="btnSubmit" style="background-color: #1e70cd; border: none; border-radius: 12px;">
                                Ajukan <i class="bi bi-send-fill ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="./js/app.js"></script>
</body>
</html>
