{% extends 'base.html' %}

{% block title %}Edit Laporan | Linkon City{% endblock %}

{% block content %}
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
    /* PAKSA FONT FREDOKA */
    * {
        font-family: 'Fredoka', sans-serif !important;
    }

    body {
        background: linear-gradient(135deg, #2d7cc1, #5ea6ff, #0c2036) !important;
        background-attachment: fixed !important;
        min-height: 100vh;
        margin: 0;
    }

    .content-wrapper {
        padding: 5px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
    }

    .form-box {
        background: rgba(209, 227, 255, 0.9); /* Konsisten dengan Add Report */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 40px;
        border-radius: 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        
        /* RESPONSIVE LAYOUT[cite: 1] */
        width: 90%;
        max-width: 800px; /* Lebar proporsional di Desktop */
        color: #14487c;
    }

    h1 {
        font-weight: 600;
        text-align: center;
        margin-bottom: 30px;
        font-size: 28px;
        color: #14487c;
    }

    /* Grid Layout untuk Form agar tidak terlalu memanjang di desktop */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .field-container {
        margin-bottom: 10px;
    }

    /* Deskripsi (biasanya textarea) dibuat full width */
    .full-width {
        grid-column: span 2;
    }

    label {
        font-weight: 600;
        color: #14487c;
        margin-bottom: 8px;
        display: inline-block;
        font-size: 14px;
        padding-left: 5px;
    }

    /* Styling Input agar identik dengan Register[cite: 2] */
    input, textarea, select {
        width: 100% !important;
        padding: 12px 18px !important;
        border-radius: 15px !important;
        border: 2px solid transparent !important;
        background: rgba(255, 255, 255, 0.8) !important;
        color: #14487c !important;
        font-size: 15px !important;
        transition: all 0.3s ease !important;
    }

    input:focus, textarea:focus, select:focus {
        background: #ffffff !important;
        border-color: #5ea6ff !important;
        outline: none !important;
        box-shadow: 0 5px 15px rgba(94, 166, 255, 0.2) !important;
    }

    /* Tombol Aksi */
    .btn-update {
        background: linear-gradient(to right, #0ea5e9, #2563eb);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 50px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        margin-top: 20px;
        font-size: 16px;
        transition: 0.3s;
    }

    .btn-update:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        color: #64748b;
        text-decoration: none;
        margin-top: 15px;
        font-size: 14px;
        font-weight: 600;
    }

    .btn-cancel:hover {
        color: #ef4444;
        text-decoration: underline;
    }

    /* 📱 MODE HP */
    @media (max-width: 768px) {
        .content-wrapper {
            padding: 5px 0;
            padding-bottom: 5px;
        }

        .form-box {
            padding: 25px 20px;
            max-width: 450px; /* Ramping di HP */
        }

        .form-grid {
            grid-template-columns: 1fr; /* Satu kolom saja di HP */
            gap: 12px;
        }

        .full-width {
            grid-column: span 1;
        }

        h1 { font-size: 24px; }
    }
</style>

<div class="content-wrapper">
    <div class="form-box">
        <h1>Edit Laporan</h1>

        <form method="POST" onsubmit="return showLoading('submit-btn')">
            {% csrf_token %}
            
            <div class="form-grid">
                {% for field in form %}
                    <div class="field-container {% if field.name == 'description' %}full-width{% endif %}">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>

            <button type="submit" id="submit-btn" class="btn-update">
                Simpan Perubahan
            </button>
            <a href="{% url 'home' %}" class="btn-cancel">Batal dan Kembali</a>
        </form>
    </div>
</div>

<script>
function showLoading(btnId) {
    const btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.style.opacity = "0.8";
    btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Menyimpan...`;
    return true;
}
</script>
{% endblock %}
