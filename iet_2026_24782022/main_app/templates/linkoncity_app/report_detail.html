<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkon City | Detail Laporan</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .info-group {
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .label {
            display: block;
            font-size: 0.9rem;
            color: #88c0d0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.2rem;
            color: #ffffff;
        }

        .status-tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            background: rgba(52, 152, 219, 0.3);
            border: 1px solid #3498db;
            color: #3498db;
            font-weight: bold;
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="detail-box">
        <h1>Detail Laporan</h1>

        <div class="info-group">
            <span class="label">Judul Masalah</span>
            <div class="value">{{ report.title }}</div>
        </div>

        <div class="info-group">
            <span class="label">Kategori</span>
            <div class="value">{{ report.category }}</div>
        </div>

        <div class="info-group">
            <span class="label">Lokasi Kejadian</span>
            <div class="value">{{ report.location }}</div>
        </div>

        <div class="info-group">
            <span class="label">Deskripsi Lengkap</span>
            <div class="value">{{ report.description }}</div>
        </div>

        <div class="info-group">
            <span class="label">Status Workflow</span>
            <div class="status-tag">{{ report.status }}</div>
        </div>

        <div class="info-group">
            <span class="label">Dilaporkan Pada</span>
            <div class="value">{{ report.created_at|date:"d F Y, H:i" }}</div>
        </div>

        <div style="text-align: center;">
            <a href="{% url 'home' %}" class="btn-back"> Kembali ke Portal</a>
        </div>
    </div>

</body>
</html>
