<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkon City | Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            /* Background gradasi biru gelap Deepspace */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Card dengan Efek Glassmorphism */
        .box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* Support untuk Safari */
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(130, 180, 255, 0.4);
            max-width: 500px;
        }

        /* Judul dengan Efek Cahaya */
        h1 {
            color: #e6f2ff;
            font-size: 38px;
            margin-bottom: 15px;
            margin-top: 0; /* Menghapus margin bawaan atas */
            text-shadow: 0 0 10px rgba(150, 200, 255, 0.7);
            font-weight: 600;
        }

        /* Deskripsi */
        p {
            color: #d8eaff;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 0; /* Menghapus margin bawah */
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Selamat Datang di Pusat Pelayanan Linkon City</h1>
        <p>
            Platform pelaporan masalah di kota Linkon. 
            Bantu menjaga kota tetap aman, nyaman, dan terhubung 
            dengan melaporkan berbagai kejadian yang terjadi di sekitar Anda.
        </p>
    </div>

</body>
</html>
