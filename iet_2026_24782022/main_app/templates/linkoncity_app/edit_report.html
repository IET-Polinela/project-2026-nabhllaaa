{% extends 'base.html' %}

{% block title %}Edit Laporan | Linkon City{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #438ad6, #2e4d88, #415a77);
    }

    .detail-box {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);

        padding: 15px; /* ⬅️ dari 30 jadi 20 biar lebih compact */
        border-radius: 25px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        width: 90%;
        margin: 10px auto 35px auto; /* ⬅️ tambah jarak bawah */
        max-width: 800px;
        color: white;
    }

    .container {
        margin-top: 0 !important;
    }

    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(162, 210, 255, 0.8);
    }

    /* Form */
    .form-group {
        margin-bottom: 12px;
    }

    label {
        font-size: 13px;
        font-weight: 600;
        color: #a2d2ff;
    }

    input, textarea, select {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    textarea {
        min-height: 80px;
    }

    .btn-primary {
        background: #0d6efd;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;

        transition: 0.2s ease; /* ⬅️ TARO DI SINI */
    }

    .btn-danger {
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;

        transition: 0.2s ease; /* ⬅️ INI JUGA */
    }

    .btn-primary:hover {
        background: #0b5ed7;
    }

    h1 {
        color: #ffffff;
        font-size: 22px;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(162, 210, 255, 0.8);
    }

    @media (max-width: 768px) {
        .container {
            padding-bottom: 0 !important;
        }

        body {
            padding-bottom: 0 !important;
        }
    }
</style>

<div class="detail-box">
    <h1>Edit Laporan</h1>

    <form method="POST" onsubmit="showLoading('submit-btn')">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}

        <div class="mt-3">
            <button type="submit" id="submit-btn" class="btn btn-primary w-100">
                Update Laporan
            </button>
            <a href="{% url 'home' %}" class="btn btn-danger w-100 mt-2">
                Batal
            </a>
        </div>
    </form>
</div>

<script>
function showLoading(btnId) {
    const btn = document.getElementById(btnId);

    btn.disabled = true;
    btn.innerText = "Loading...";
}
</script>
{% endblock %}
