{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #438ad6, #2e4d88, #415a77);
    }

    .register-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 70px);
    }

    .register-box {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);

        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);

        width: 90%;
        max-width: 500px;

        color: white;
    }

    h3 {
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(162, 210, 255, 0.8);
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 12px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    .btn-primary {
        border-radius: 8px;
        font-weight: 600;
    }

    /* 📱 HP */
    @media (max-width: 600px) {
        .container {
            padding-bottom: 0 !important;
        }

        body {
            padding-bottom: 35px !important;
        }
    }
    
</style>

<div class="register-wrapper">
    <div class="register-box">
        <h3>Register</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Daftar
            </button>
        </form>
    </div>
</div>
{% endblock %}
