{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #438ad6, #2e4d88, #415a77);
        overflow: hidden;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(80vh - 70px);
    }

    .login-box {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);

        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);

        width: 90%;
        max-width: 400px;

        color: white;
    }

    h3 {
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(162, 210, 255, 0.8);
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 12px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    .btn-primary {
        border-radius: 8px;
        font-weight: 600;
    }

    /* 📱 HP */
    @media (max-width: 768px) {
        .login-wrapper {
            align-items: flex-start;
            padding-top: 40px;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-box">
        <h3>Login</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
