
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkon City | Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* PAKSA FONT FREDOKA KE SEMUA ELEMEN */
        * {
            font-family: 'Fredoka', sans-serif !important;
        }

        body {
            background: linear-gradient(135deg, #2d7cc1, #5ea6ff, #0c2036);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #14487c;
            overflow-x: hidden; /* Mencegah scroll horizontal di HP */
        }

        .dashboard-title {
            text-align: center;
            color: white;
            font-size: clamp(24px, 8vw, 42px); /* Font ukuran dinamis */
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: 600;
        }

        /* Search Bar Responsive */
        #searchInput {
            width: 100%;
            max-width: 600px;
            padding: 14px 25px;
            margin: 0 auto 30px auto;
            border: 2px solid #5ea6ff;
            border-radius: 50px;
            display: block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: white;
            font-size: 16px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        /* Layout Grid menggunakan Flexbox yang cerdas */
        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dash-card {
            flex: 1;
            min-width: 300px; /* Lebar minimum sebelum dia turun ke bawah */
            background: rgba(209, 227, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .chart-container {
            position: relative;
            height: 250px; /* Tinggi dikecilkan sedikit agar pas di layar HP */
            width: 100%;
        }

        /* List Styling */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: rgba(255,255,255,0.6);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.4);
        }
        li:hover { 
            background: rgba(255,255,255,0.9); 
            transform: scale(1.02);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
        }
        .bg-reported { background-color: #27292c; }
        .bg-verified { background-color: #0d6efd; }
        .bg-progress { background-color: #ffc107; color: black; }
        .bg-resolved { background-color: #198754; }

        /* Responsive Adjustment */
        @media (max-width: 576px) {
            body { padding: 15px; }
            .dash-card { padding: 15px; min-width: 100%; }
            .dashboard-title { margin-top: 10px; }
        }
        /* Aturan khusus untuk ukuran modal */
        @media (min-width: 992px) {
            .custom-modal-size {
                max-width: 800px; /* Membuat modal melebar di desktop */
            }
        }

        @media (max-width: 576px) {
            .custom-modal-size {
                margin: 10px; /* Memberi jarak di pinggir layar HP agar tidak nempel */
            }
            
            .modal-content {
                transform: scale(0.97); /* Efek sedikit 'zoom out' agar konten tidak terlihat sesak */
                transform-origin: center;
            }

            .modal-title {
                font-size: 18px !important; /* Mengecilkan judul sedikit di mobile */
            }
        }

        .description-box {
            background: rgba(0,0,0,0.02);
            padding: 15px;
            border-radius: 15px;
        }

        .btn-back-home {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }
        .btn-back-home:hover {
            background: white;
            color: #14487c;
        }
</style>
    </style>
</head>
<div class="container-fluid py-3">
    <a href="{% url 'home' %}" class="btn-back-home">
        ⬅️ Kembali ke Portal Linkon City
    </a>
</div>
<body>

<div class="dashboard-container">
    <h1 class="dashboard-title">DASHBOARD LINKON CITY</h1>

    <input type="text" id="searchInput" placeholder="Cari Judul atau Kategori...">

    <!-- SECTION CHART -->
    <div class="dashboard-grid">
        <div class="dash-card">
            <h2 class="h6 mb-3 fw-bold">Statistik Status</h2>
            <div class="chart-container">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <div class="dash-card">
            <h2 class="h6 mb-3 fw-bold">Statistik Kategori</h2>
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- SECTION LIST -->
    <div class="dashboard-grid">
        <div class="dash-card">
            <h2 class="h6 mb-3 fw-bold text-primary">Laporan Terbaru</h2>
            <ul id="reportedList"></ul>
        </div>
        <div class="dash-card">
            <h2 class="h6 mb-3 fw-bold text-success">Laporan Selesai</h2>
            <ul id="resolvedList"></ul>
        </div>
    </div>
</div>

<!-- Modal Detail -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg custom-modal-size">
        <div class="modal-content" style="border-radius: 25px; border: none; background: rgba(255,255,255,0.98); box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div class="modal-header border-0 pt-4 px-4">
                <h4 class="modal-title fw-bold" id="modalTitle" style="color: #14487c;"></h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <div class="row mb-3">
                    <div class="col-6">
                        <small class="text-muted d-block text-uppercase" style="font-size: 10px; letter-spacing: 1px;">Kategori</small>
                        <span id="modalCategory" class="fw-bold text-primary" style="font-size: 16px;"></span>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted d-block text-uppercase" style="font-size: 10px; letter-spacing: 1px;">Status</small>
                        <span id="modalStatusBadge" class="status-badge"></span>
                    </div>
                </div>
                <div class="mb-3">
                    <small class="text-muted d-block text-uppercase" style="font-size: 10px; letter-spacing: 1px;">Waktu Pelaporan</small>
                    <span id="modalDate" class="text-dark fw-semibold"></span>
                </div>
                <hr style="opacity: 0.1;">
                <div class="description-box">
                    <small class="text-muted d-block text-uppercase mb-2" style="font-size: 10px; letter-spacing: 1px;">Deskripsi Laporan</small>
                    <p id="modalDescription" class="text-dark mb-0" style="line-height: 1.6; font-size: 15px;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Konfigurasi Global Chart
    Chart.defaults.font.family = 'Fredoka';
    Chart.defaults.color = '#14487c';

    // Variabel untuk menyimpan instance chart agar bisa dihapus/di-update
    let statusChartInstance = null;
    let categoryChartInstance = null;

    // 1. FUNGSI UTAMA (UNTUK AMBIL DATA & REFRESH)
    function refreshDashboardData() {
        const searchQuery = document.getElementById('searchInput').value;
        if (searchQuery.trim() !== "") return;

        console.log("Menyegarkan data dashboard...");

        fetch('/dashboard/data/')
        .then(res => res.json())
        .then(data => {
            const colorMap = { 'REPORTED': '#27292c', 'VERIFIED': '#0d6efd', 'IN_PROGRESS': '#ffc107', 'RESOLVED': '#198754' };
            
            // --- Update Status Chart ---
            if (statusChartInstance) statusChartInstance.destroy();
            statusChartInstance = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: data.status_data.map(i => i.status),
                    datasets: [{
                        data: data.status_data.map(i => i.total),
                        backgroundColor: data.status_data.map(i => colorMap[i.status]),
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
            });

            // --- Update Category Chart ---
            if (categoryChartInstance) categoryChartInstance.destroy();
            categoryChartInstance = new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: data.category_data.map(i => i.category),
                    datasets: [{
                        label: 'Jumlah',
                        data: data.category_data.map(i => i.total),
                        backgroundColor: '#0ea5e9',
                        borderRadius: 10
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // --- Update Lists (5/5) ---
            renderList(data.latest_reported, data.latest_resolved);
        });
    }

    // 2. FUNGSI RENDER LIST
    function renderList(reportedData, resolvedData) {
        const rList = document.getElementById('reportedList');
        const sList = document.getElementById('resolvedList');
        rList.innerHTML = ""; 
        sList.innerHTML = "";

        const createLi = (item, color) => {
            const li = document.createElement('li');
            li.style.borderLeft = `6px solid ${color}`;
            li.innerHTML = `<strong>${item.title}</strong><br><small class="text-muted">${item.category}</small>`;
            li.onclick = () => openDetail(item.id || item.pk);
            return li;
        };

        reportedData.forEach(i => rList.appendChild(createLi(i, '#0ea5e9')));
        resolvedData.forEach(i => sList.appendChild(createLi(i, '#198754')));
    }

    // 3. FUNGSI MODAL
    function openDetail(id) {
        fetch(`/api/report-detail/${id}/`)
        .then(res => res.json())
        .then(data => {
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalCategory').innerText = data.category;
            document.getElementById('modalDate').innerText = data.created_at;
            document.getElementById('modalDescription').innerText = data.description;
            const b = document.getElementById('modalStatusBadge');
            b.innerText = data.status;
            b.className = 'status-badge ' + (data.status === 'RESOLVED' ? 'bg-resolved' : data.status === 'REPORTED' ? 'bg-reported' : 'bg-progress');
            new bootstrap.Modal(document.getElementById('detailModal')).show();
        });
    }

    // 4. EVENT SEARCH
    document.getElementById('searchInput').addEventListener('keyup', function () {
        const q = this.value;
        if (q.trim() === "") {
            refreshDashboardData();
            return;
        }

        fetch(`/dashboard/search/?q=${q}`)
            .then(res => res.json())
            .then(data => {
                renderList(data.reported, data.resolved);
            });
    });

    // 5. JALANKAN PERTAMA KALI & SET INTERVAL
    refreshDashboardData();
    setInterval(refreshDashboardData, 5000); 
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
